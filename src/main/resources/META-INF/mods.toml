modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The patched mods, pinned to the exact versions whose bytecode the mixins target. Installed on every client and server.
[[dependencies.${mod_id}]]
    modId="numina"
    mandatory=true
    versionRange="${numina_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="powersuits"
    mandatory=true
    versionRange="${powersuits_version_range}"
    ordering="AFTER"
    side="BOTH"

# EMI is optional and client-side: the EMI fixes (F-11 onward) apply only when EMI ${emi_version} is loaded (checked by the
# mixin config plugin, which logs one WARN line and skips them for any other EMI). The range stays open on purpose: Forge
# checks an optional dependency's range whenever the mod is present, and an exact range here would refuse to start instead.
[[dependencies.${mod_id}]]
    modId="emi"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

# JEI is optional and client-side: the JEI fix (F-19) applies only when a JEI 15.74 build is loaded (checked by the mixin
# config plugin, which logs one WARN line and skips it for any other JEI). The range stays open for the same reason as EMI's.
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

# AdvancedAE is optional, on both sides: the quantum armor fix (F-25) applies only when AdvancedAE ${aae_version} is loaded
# (checked by the mixin config plugin, which logs one WARN line and skips it for any other build). Open range for the same
# reason as EMI's.
[[dependencies.${mod_id}]]
    modId="advanced_ae"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Gobber 2 is optional, on both sides: the dragon armour flight fix (F-27) applies only when Gobber ${gobber_version} is loaded
# (checked by the mixin config plugin, which logs one WARN line and skips it for any other build). Open range for the same
# reason as EMI's.
[[dependencies.${mod_id}]]
    modId="gobber2"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Compact Machines is optional, on both sides: its fixes (F-28 onward) apply only when Compact Machines ${cm_version} is
# loaded (checked by the mixin config plugin, which logs one WARN line and skips them for any other build). Open range for
# the same reason as EMI's.
[[dependencies.${mod_id}]]
    modId="compactmachines"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# MFFS (Modular Force Field System) is optional, on both sides: its fixes (F-34 onward) apply only when MFFS ${mffs_version} is
# loaded (checked by the mixin config plugin, which logs one WARN line and skips them for any other build). Open range for the
# same reason as EMI's.
[[dependencies.${mod_id}]]
    modId="mffs"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Deep Resonance is optional, on both sides: its fix (F-38) applies only when Deep Resonance ${dr_version} is loaded (checked by
# the mixin config plugin, which logs one WARN line and skips it for any other build). Open range for the same reason as EMI's.
[[dependencies.${mod_id}]]
    modId="deepresonance"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Iron Furnaces is optional, on both sides: its fix (F-39) applies only when Iron Furnaces ${if_version} is loaded (checked by the
# mixin config plugin, which logs one WARN line and skips it for any other build). Open range for the same reason as EMI's.
[[dependencies.${mod_id}]]
    modId="ironfurnaces"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Voltaic is optional, on both sides: its fix (F-40) applies only when Voltaic ${voltaic_version} is loaded together with Mekanism
# and Curios (checked by the mixin config plugin, which logs one line and skips it otherwise). Open range for the same reason as
# EMI's.
[[dependencies.${mod_id}]]
    modId="voltaic"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Evolved Mekanism is optional, on both sides: its fix (F-42) applies only when Evolved Mekanism ${evolvedmekanism_version} is
# loaded together with Elytra Slot and Curios (checked by the mixin config plugin, which logs one line and skips it otherwise).
# Open range for the same reason as EMI's.
[[dependencies.${mod_id}]]
    modId="evolvedmekanism"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Elytra Slot is optional, on both sides: the Evolved Mekanism fix (F-42) reads its elytra predicate from inside Evolved Mekanism's
# deferred setup work, by which time Elytra Slot has long filled it (in its constructor), so the ordering here is for the record only.
# Any version: the member the fix reads is checked in bytecode.
[[dependencies.${mod_id}]]
    modId="elytraslot"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
