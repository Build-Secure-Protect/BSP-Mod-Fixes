modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The patched mods, pinned to the exact versions whose bytecode the mixins target. Installed on every client and server.
[[dependencies.${mod_id}]]
    modId="numina"
    mandatory=true
    versionRange="${numina_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="powersuits"
    mandatory=true
    versionRange="${powersuits_version_range}"
    ordering="AFTER"
    side="BOTH"

# EMI is optional and client-side: the EMI fixes (F-11 onward) apply only when EMI ${emi_version} is loaded (checked by the
# mixin config plugin, which logs one WARN line and skips them for any other EMI). The range stays open on purpose: Forge
# checks an optional dependency's range whenever the mod is present, and an exact range here would refuse to start instead.
[[dependencies.${mod_id}]]
    modId="emi"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

# JEI is optional and client-side: the JEI fix (F-19) applies only when a JEI 15.74 build is loaded (checked by the mixin
# config plugin, which logs one WARN line and skips it for any other JEI). The range stays open for the same reason as EMI's.
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"
