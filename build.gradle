plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_archive_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Other mods' mixins carry obfuscated names: remap their reference maps in a dev run.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // ./gradlew <run> -PmixinVerbose: Mixin logs every injection it applies
            if (project.hasProperty('mixinVerbose')) {
                property 'mixin.debug.verbose', 'true'
            }
            // ./gradlew <run> -PskipFixes=AaeDamageAbsorptionMixin,...: the named mixins are switched off for this run (the
            // startup report lists their fixes as skipped), so a test can show the patched mod's own behaviour.
            if (project.hasProperty('skipFixes')) {
                property 'bsp_mod_fixes.skipMixins', project.property('skipFixes')
            }

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            // ./gradlew runClient -PquickPlay=<world in run/saves>: opens that world at once (vanilla quick play), so a
            // headless check can reach the recipe reload (EMI's JEI layer only loads in a world).
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay')
            }
            // ./gradlew runClient -PwithEmi -PemiProbe: runs gametest/EmiClientProbe once loading is complete (the EMI
            // fixes' methods, called on EMI's real classes without a screen); its lines start "BSP-Mod Fixes probe".
            if (project.hasProperty('emiProbe')) {
                property 'bsp_mod_fixes.emiProbe', 'true'
            }
            // ./gradlew runClient -PwithEmi -PwithMekanism -PrecipeProbe -PquickPlay=emitest: runs gametest/EmiRecipeProbe
            // once the world is open and EMI has reloaded (what EMI and JEI hold for Mekanism), then closes the client.
            if (project.hasProperty('recipeProbe')) {
                property 'bsp_mod_fixes.recipeProbe', 'true'
            }
            // ./gradlew runClient -PtitleProbe: the client closes itself a few seconds after the title screen is up, so a
            // headless run that only wants the startup log ends on its own (gametest/TitleProbe).
            if (project.hasProperty('titleProbe')) {
                property 'bsp_mod_fixes.titleProbe', 'true'
            }
            // ./gradlew runClient -PwithAae -PreadoutProbe -PquickPlay=emitest: dresses the player in a charged quantum set,
            // hurts them, collapses and reopens the suit readout, screenshotting each state to run/screenshots (gametest/ReadoutProbe).
            if (project.hasProperty('readoutProbe')) {
                property 'bsp_mod_fixes.readoutProbe', 'true'
            }
            // ./gradlew runClient -PwithCm -PpreviewProbe -PquickPlay=cmtest: opens Compact Machines' room preview thirty
            // times and logs the OpenGL objects and memory before and after (gametest/PreviewProbe). The world must be one
            // kept for Compact Machines runs: its room dimension is written into the save.
            if (project.hasProperty('previewProbe')) {
                property 'bsp_mod_fixes.previewProbe', 'true'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
            if (project.hasProperty('withCm')) {
                args '--world', 'world_cm'
            }
        }

        // ./gradlew runGameTestServer: runs every registered GameTest headlessly and exits.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
            // holds each test back until its chunks tick (1.20.1's runner starts the clock before they do); this run only, never in the jar's MixinConfigs
            args '--mixin.config', 'bsp_mod_fixes.gametest.mixins.json'
            // Compact Machines adds a datapack dimension, which is written into the world's level.dat; a world that has it
            // cannot load without the mod, so -PwithCm runs keep a world folder of their own (run/world_cm).
            if (project.hasProperty('withCm')) {
                args '--world', 'world_cm'
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Mixins: the refmap is written beside the classes; `config` hands the mixin config to every run (the jar names it in MixinConfigs below).
mixin {
    add sourceSets.main, 'bsp_mod_fixes.refmap.json'
    config 'bsp_mod_fixes.mixins.json'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // CurseMaven: the exact Numina and Modular Powersuits files the pack ships (project id and file id in gradle.properties).
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Writes the mixin refmap (obfuscated names for the mixins' targets) at compile time.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // The two mods this mod patches: compiled against and loaded in every dev run (mandatory in mods.toml, exact versions).
    implementation fg.deobf("curse.maven:${numina_curse}")
    implementation fg.deobf("curse.maven:${powersuits_curse}")

    // EMI and the JEI API, compiled against for the EMI fixes (F-11 onward); optional at runtime, gated to emi_version.
    compileOnly fg.deobf("curse.maven:${emi_curse}")
    compileOnly fg.deobf("curse.maven:${jei_curse}")

    // AdvancedAE and AE2, compiled against for the quantum armor fix (F-25); optional at runtime, gated to aae_version.
    compileOnly fg.deobf("curse.maven:${ae2_curse}")
    compileOnly fg.deobf("curse.maven:${aae_curse}")
    compileOnly fg.deobf("curse.maven:${geckolib_curse}")
    compileOnly fg.deobf("${ae2addonlib_maven}")

    // Gobber 2, compiled against for the dragon armour flight fix (F-27); optional at runtime, gated to gobber_version.
    compileOnly fg.deobf("curse.maven:${gobber_curse}")

    // Compact Machines, compiled against for its fixes (F-28 onward); optional at runtime, gated to cm_version.
    compileOnly fg.deobf("curse.maven:${cm_curse}")

    // ./gradlew runClient -PwithEmi (or any run): EMI, JEI, Tinkers' Construct and Mantle load, for the in-game checks of docs/TESTING.md.
    if (project.hasProperty('withEmi')) {
        runtimeOnly fg.deobf("curse.maven:${emi_curse}")
        runtimeOnly fg.deobf("curse.maven:${jei_curse}")
        runtimeOnly fg.deobf("curse.maven:${tconstruct_curse}")
        runtimeOnly fg.deobf("curse.maven:${mantle_curse}")
    }
    // Investigation runs (the pack's exact files): -PwithMekanism loads Mekanism, -PwithAu AlmostUnified (its config goes in
    // run/config/almostunified), -PwithCrt CraftTweaker and JEITweaker (scripts in run/scripts).
    if (project.hasProperty('withMekanism')) {
        runtimeOnly fg.deobf("curse.maven:${mekanism_curse}")
    }
    if (project.hasProperty('withAu')) {
        runtimeOnly fg.deobf("curse.maven:${almostunified_curse}")
    }
    if (project.hasProperty('withCrt')) {
        runtimeOnly fg.deobf("curse.maven:${crafttweaker_curse}")
        runtimeOnly fg.deobf("curse.maven:${jeitweaker_curse}")
    }
    // ./gradlew runGameTestServer -PwithAae (or any run): AdvancedAE, AE2 and GuideME load, so the quantum armor tests run
    // against the real mod; without it those tests only check the pure logic and the gate's skip.
    if (project.hasProperty('withAae')) {
        runtimeOnly fg.deobf("curse.maven:${aae_curse}")
        runtimeOnly fg.deobf("curse.maven:${ae2_curse}")
        runtimeOnly fg.deobf("curse.maven:${guideme_curse}")
        runtimeOnly fg.deobf("curse.maven:${geckolib_curse}")
    }
    // ./gradlew runGameTestServer -PwithGobber (or any run): Gobber 2 loads (the exact pack file), so the dragon armour test
    // ticks a dressed player through the real item; without it that test only checks the pure rule and the gate's skip.
    if (project.hasProperty('withGobber')) {
        runtimeOnly fg.deobf("curse.maven:${gobber_curse}")
    }
    // ./gradlew runGameTestServer -PwithCm (or any run): Compact Machines loads (the exact pack file, with the Gander
    // libraries nested in it), so its tests call the real mod; without it they check the pure rules and the gate's skip.
    if (project.hasProperty('withCm')) {
        runtimeOnly fg.deobf("curse.maven:${cm_curse}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            numina_version_range: numina_version_range, powersuits_version_range: powersuits_version_range,
            emi_version: emi_version, aae_version: aae_version, gobber_version: gobber_version, cm_version: cm_version,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// The two lang files this jar ships (tools/gen_lang.py) must parse and carry every module category name.
tasks.register('checkLang', Exec) {
    description = 'Checks the shipped Numina and Powersuits lang files.'
    commandLine 'python3', '-I', 'tools/check_lang.py'
    // The same checks run as a GameTest; without python3 on the PATH this task only warns instead of failing the build.
    onlyIf {
        def found = System.getenv('PATH')?.split(File.pathSeparator)?.any { new File(it, 'python3').canExecute() }
        if (!found) logger.warn('checkLang skipped: python3 is not on the PATH (the lang GameTest still covers the files)')
        return found
    }
}
check.dependsOn 'checkLang'

// The GameTests, their helpers and the GameTest server's own mixins (bsp_mod_fixes.gametest.mixins.json) stay out of the jar.
def gameTestMixin = ['bsp_mod_fixes.gametest.mixins.json', 'com/mrgregles/bsp_mod_fixes/mixin/gametest/**', 'com/mrgregles/bsp_mod_fixes/gametest/**']

tasks.named('jar', Jar).configure {
    exclude gameTestMixin
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'bsp_mod_fixes.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
