org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
# 47.3.10 is where Forge began handing FMLJavaModLoadingContext to mod constructors, which BSPModFixes relies on.
forge_version_range=[47.3.10,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

mod_id=bsp_mod_fixes
mod_name=BSP-Mod Fixes
mod_license=MIT
mod_version=0.20.0
mod_group_id=com.mrgregles.bsp_mod_fixes
mod_authors=Mrgregles
mod_description=Fixes for other mods in the Build Secure Protect (BSP) modpack: bugs and exploits in Numina and Modular Powersuits, patched without changing their jars.
mod_archive_name=bsp-mod-fixes

# The two mods this mod patches, pinned to the exact files the pack ships (CurseForge project:file). The mixins target this
# bytecode, so the version ranges in mods.toml are exact: a different version refuses to start instead of mis-patching.
numina_curse=numina-235440:5303699
numina_version_range=[2.3.13]
powersuits_curse=modular-powersuits-235442:5303700
powersuits_version_range=[2.3.13]

# The client-side EMI work (F-11 onward): EMI and the JEI API are compiled against (exact files from the pack), never shipped
# or required. The mixins apply only when EMI is loaded at exactly emi_version (MixinFixPlugin); any other EMI logs one WARN
# line and costs those fixes. `-PwithEmi` on a run loads these four for an in-game check (Tinkers and Mantle only for that).
emi_curse=emi-580555:8081375
emi_version=1.1.24+1.20.1+forge
jei_curse=jei-238222:9827054
tconstruct_curse=tinkers-construct-74072:8944121
mantle_curse=mantle-74924:8809819

# Investigation runs only (never shipped or required): the pack's exact Mekanism, AlmostUnified, CraftTweaker and JEITweaker
# files, loaded by `-PwithMekanism`, `-PwithAu` and `-PwithCrt` on a client run with `-PrecipeProbe`.
mekanism_curse=mekanism-268560:6552911
almostunified_curse=almostunified-633823:7430993
crafttweaker_curse=crafttweaker-239197:7772873
jeitweaker_curse=jeitweaker-368718:4781713

# AdvancedAE and the AE2 it needs (F-25): compiled against, never shipped or required; the mixin into AdvancedAE applies only
# when exactly aae_version is loaded (MixinFixPlugin) and is skipped with one WARN line otherwise. `-PwithAae` on a run loads
# AdvancedAE, AE2 and GuideME (AE2's own dependency), the exact pack files, for the quantum armor GameTests.
aae_curse=advanced-ae-1084104:8564205
aae_version=1.3.6-1.20.1
ae2_curse=applied-energistics-2-223794:9357405
guideme_curse=guideme-1173950:8204776
# AdvancedAE's armor classes extend GeckoLib's and ae2addonlib's (the latter nested inside AdvancedAE's jar, and published
# on Maven Central at the same version), so both are on the compile classpath; a run gets ae2addonlib from the nested jar.
geckolib_curse=geckolib-388172:6789487
ae2addonlib_maven=io.github.pedroksl:ae2addonlib:1.0.4-1.20.1

# Gobber 2 (F-27): compiled against, never shipped or required; the mixin into its dragon armour applies only when exactly
# gobber_version is loaded (MixinFixPlugin) and is skipped with one WARN line otherwise. `-PwithGobber` on a run loads the exact pack file.
gobber_curse=gobber-301700:5329818
gobber_version=2.8.9

# Compact Machines (F-28 onward): compiled against, never shipped or required; the mixins into it apply only when exactly
# cm_version is loaded (MixinFixPlugin) and are skipped with one WARN line otherwise. `-PwithCm` on a run loads the exact pack file.
cm_curse=compact-machines-224218:6000230
cm_version=6.0.3
# The Voltaic family and MFFS for the explosion chunk measurement (MF-30): never shipped, required or compiled against;
# `-PwithBallistix` on a run loads the exact pack files (Ballistix needs Voltaic; its nuclear blast names Nuclear Science and
# Electrodynamics, its Darkmatter blast MFFS, each behind a loaded check), so the blast GameTests fire the real blasts.
voltaic_curse=voltaic-1237904:9437780
electrodynamics_curse=electrodynamics-316867:9437784
nuclearscience_curse=nuclear-science-318646:9437797
# Voltaic (F-40): compiled against for the mixin target, never shipped or required; the mixin applies only when exactly
# voltaic_version is loaded with Mekanism and Curios (MixinFixPlugin). Curios and Mekanism are compiled against for the two API
# members the fix calls. `-PwithHazmat` on a run loads the Voltaic family, Mekanism, Curios, Evolved Mekanism and its IgleeLib
# (the exact pack files), so the F-40 test doses a mock player wearing the real Portable Hazmat Suit.
voltaic_version=1.20.1-1.2.2
curios_curse=curios-309927:6418456
evolvedmekanism_curse=evolved-mekanism-1230085:9685752
igleelib_curse=iglees-library-541199:6987117
# Evolved Mekanism (F-42): compiled against for the mixin target, never shipped or required; the mixin applies only when exactly
# evolvedmekanism_version is loaded with Elytra Slot and Curios (MixinFixPlugin). Elytra Slot is compiled against for the one
# member the fix reads (its elytra predicate). `-PwithElytra` on a run loads the Hazmat set plus Elytra Slot and Caelus (the exact
# pack files), so the F-42 test looks the real HDPE Reinforced Elytra's curio capability up.
evolvedmekanism_version=1.3.0-fix3
elytraslot_curse=elytraslot-317716:5778734
caelus_curse=caelus-308989:5281700
ballistix_curse=ballistix-443915:9437822
mffs_curse=mffs-238546:8649940
# Integrated Dynamics (F-49 onward): compiled against for the mixin targets, with its two required libraries, never shipped or
# required; the mixins into it apply only when exactly id_version is loaded with Cyclops Core and Common Capabilities
# (MixinFixPlugin) and are skipped with one WARN line otherwise. `-PwithId` on a run loads the exact pack files.
id_curse=integrated-dynamics-236307:9626465
id_version=1.31.5
cyclopscore_curse=cyclops-core-232758:9607385
commoncapabilities_curse=common-capabilities-247007:7229322
# MFFS (F-34 onward): compiled against for the mixin targets, never shipped or required; the mixins into it apply only when exactly
# mffs_version is loaded (MixinFixPlugin) and are skipped with one WARN line otherwise. `-PwithMffs` on a run loads the exact pack file.
mffs_version=5.1.29

# Deep Resonance (F-38): compiled against for the mixin target, never shipped or required; the mixin into it applies only when
# exactly dr_version is loaded (MixinFixPlugin) and is skipped with one WARN line otherwise. `-PwithDr` on a run loads the exact
# pack files of Deep Resonance and the two McJty libraries it needs (McJtyLib and RFTools Base).
dr_curse=deepresonance-233398:8256198
dr_version=1.20-5.0.6
mcjtylib_curse=mcjtylib-233105:8256165
rftoolsbase_curse=rftools-base-326041:8256170

# Iron Furnaces (F-39): compiled against for the mixin target, never shipped or required; the mixin into it applies only when
# exactly if_version is loaded (MixinFixPlugin) and is skipped with one WARN line otherwise. `-PwithIf` on a run loads the exact
# pack file (Iron Furnaces depends on Forge only).
if_curse=ironfurnaces-237664:7888952
if_version=4.1.8

# Investigation runs only (never shipped, required or compiled against): the pack's exact Ender IO and AllTheLeaks files, loaded by
# `-PwithEnderIo` and `-PwithAtl` on a client run with `-PenchanterProbe` (EMI's Enchanting category showing "Error Rendering").
enderio_curse=enderio-64578:7726916
alltheleaks_curse=alltheleaks-1091339:9640602
