# Enchantment Descriptions (with Bookshelf), the mods of the pack that change enchantments or the items a recipe shows.
apotheosis_curse=apotheosis-313970:6461960
placebo_curse=placebo-283644:6274231
apothicattributes_curse=apothic-attributes-898963:5634071
enchdesc_curse=enchantment-descriptions-250419:7612607
bookshelf_curse=bookshelf-228525:7612389
# `-PwithBspSu` on the same probe run loads the pack's BSP Server Utilities 0.11.1 (the one mod pack 4.9 changed) with BSP-Core 1.17.1.
bsp_su_curse=bsp-server-utilities-1756675:9663307
bsp_core_curse=bsp-core-1723271:9633374
