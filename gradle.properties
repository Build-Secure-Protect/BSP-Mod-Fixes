org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
# 47.3.10 is where Forge began handing FMLJavaModLoadingContext to mod constructors, which BSPModFixes relies on.
forge_version_range=[47.3.10,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

mod_id=bsp_mod_fixes
mod_name=BSP-Mod Fixes
mod_license=MIT
mod_version=0.7.0
mod_group_id=com.mrgregles.bsp_mod_fixes
mod_authors=Mrgregles
mod_description=Fixes for other mods in the Build Secure Protect (BSP) modpack: bugs and exploits in Numina and Modular Powersuits, patched without changing their jars.
mod_archive_name=bsp-mod-fixes

# The two mods this mod patches, pinned to the exact files the pack ships (CurseForge project:file). The mixins target this
# bytecode, so the version ranges in mods.toml are exact: a different version refuses to start instead of mis-patching.
numina_curse=numina-235440:5303699
numina_version_range=[2.3.13]
powersuits_curse=modular-powersuits-235442:5303700
powersuits_version_range=[2.3.13]

# The client-side EMI work (F-11 onward): EMI and the JEI API are compiled against (exact files from the pack), never shipped
# or required. The mixins apply only when EMI is loaded at exactly emi_version (MixinFixPlugin); any other EMI logs one WARN
# line and costs those fixes. `-PwithEmi` on a run loads these four for an in-game check (Tinkers and Mantle only for that).
emi_curse=emi-580555:8081375
emi_version=1.1.24+1.20.1+forge
jei_curse=jei-238222:9394360
tconstruct_curse=tinkers-construct-74072:8944121
mantle_curse=mantle-74924:8809819

# Investigation runs only (never shipped or required): the pack's exact Mekanism, AlmostUnified, CraftTweaker and JEITweaker
# files, loaded by `-PwithMekanism`, `-PwithAu` and `-PwithCrt` on a client run with `-PrecipeProbe`.
mekanism_curse=mekanism-268560:6552911
almostunified_curse=almostunified-633823:7430993
crafttweaker_curse=crafttweaker-239197:7772873
jeitweaker_curse=jeitweaker-368718:4781713

# AdvancedAE and the AE2 it needs (F-25): compiled against, never shipped or required; the mixin into AdvancedAE applies only
# when exactly aae_version is loaded (MixinFixPlugin) and is skipped with one WARN line otherwise. `-PwithAae` on a run loads
# AdvancedAE, AE2 and GuideME (AE2's own dependency), the exact pack files, for the quantum armor GameTests.
aae_curse=advanced-ae-1084104:8564205
aae_version=1.3.6-1.20.1
ae2_curse=applied-energistics-2-223794:9357405
guideme_curse=guideme-1173950:8204776
# AdvancedAE's armor classes extend GeckoLib's and ae2addonlib's (the latter nested inside AdvancedAE's jar, and published
# on Maven Central at the same version), so both are on the compile classpath; a run gets ae2addonlib from the nested jar.
geckolib_curse=geckolib-388172:6789487
ae2addonlib_maven=io.github.pedroksl:ae2addonlib:1.0.4-1.20.1

# Gobber 2 (F-27): compiled against, never shipped or required; the mixin into its dragon armour applies only when exactly
# gobber_version is loaded (MixinFixPlugin) and is skipped with one WARN line otherwise. `-PwithGobber` on a run loads the exact pack file.
gobber_curse=gobber-301700:5329818
gobber_version=2.8.9

# Compact Machines (F-28 onward): compiled against, never shipped or required; the mixins into it apply only when exactly
# cm_version is loaded (MixinFixPlugin) and are skipped with one WARN line otherwise. `-PwithCm` on a run loads the exact pack file.
cm_curse=compact-machines-224218:6000230
cm_version=6.0.3
