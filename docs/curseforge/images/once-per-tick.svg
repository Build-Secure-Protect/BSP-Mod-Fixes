<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<rect width="1200" height="1200" fill="#0B0F14"/>
<g transform="translate(0, 340)">
<rect width="1200" height="520" fill="#0B0F14"/>
<text x="40" y="64" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#E6EAF2" text-anchor="start">The suit ticks once per tick</text>
<text x="40" y="100" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#9AA3B5" text-anchor="start">Numina's tick handler never looked at the phase, so every module ran at the start and the end of each tick.</text>
<rect x="40" y="130" width="560" height="360" rx="10" fill="#10151C" stroke="#FF6B5C" stroke-width="2" opacity="1"/>
<text x="62" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#FF6B5C" text-anchor="start" letter-spacing="2">BEFORE: TWICE A TICK</text>
<line x1="62" y1="186" x2="578" y2="186" stroke="#2A2F3A" stroke-width="1" stroke-linecap="round"/>
<rect x="70" y="200" width="240" height="120" rx="8" fill="#0C0E12" stroke="#FF6B5C" stroke-width="1.5" opacity="1"/>
<text x="190" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FF6B5C" text-anchor="middle" letter-spacing="2">START</text>
<text x="190" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#9AA3B5" text-anchor="middle">modules tick</text>
<text x="190" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#9AA3B5" text-anchor="middle">thrust, drain, cooling</text>
<rect x="340" y="200" width="240" height="120" rx="8" fill="#0C0E12" stroke="#FF6B5C" stroke-width="1.5" opacity="1"/>
<text x="460" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FF6B5C" text-anchor="middle" letter-spacing="2">END</text>
<text x="460" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#9AA3B5" text-anchor="middle">modules tick</text>
<text x="460" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#9AA3B5" text-anchor="middle">thrust, drain, cooling</text>
<line x1="310" y1="260" x2="340" y2="260" stroke="#2A2F3A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="340" y1="260" x2="327.7138441335348" y2="266.71195754045885" stroke="#2A2F3A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="340" y1="260" x2="327.7138441335348" y2="253.28804245954115" stroke="#2A2F3A" stroke-width="2.5" stroke-linecap="round"/>
<text x="70" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#E6EAF2" text-anchor="start">Jetpack thrust and drain doubled; Night Vision,</text>
<text x="70" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#E6EAF2" text-anchor="start">cooling and every other module ran twice as fast.</text>
<text x="70" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#9AA3B5" text-anchor="start">Powersuits' own update handler ran for every hurt,</text>
<text x="70" y="454" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#9AA3B5" text-anchor="start">jump, fall and drop event of every creature too (F-4).</text>
<rect x="620" y="130" width="540" height="360" rx="10" fill="#10151C" stroke="#8FE04A" stroke-width="2" opacity="1"/>
<text x="642" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#8FE04A" text-anchor="start" letter-spacing="2">NOW: ONCE, AT THE START</text>
<line x1="642" y1="186" x2="1138" y2="186" stroke="#2A2F3A" stroke-width="1" stroke-linecap="round"/>
<rect x="650" y="200" width="240" height="120" rx="8" fill="#0C0E12" stroke="#8FE04A" stroke-width="1.5" opacity="1"/>
<text x="770" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#8FE04A" text-anchor="middle" letter-spacing="2">START</text>
<text x="770" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#9AA3B5" text-anchor="middle">modules tick</text>
<text x="770" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#9AA3B5" text-anchor="middle">once per tick</text>
<rect x="910" y="200" width="220" height="120" rx="8" fill="#0C0E12" stroke="#2A2F3A" stroke-width="1.5" opacity="1"/>
<text x="1020" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#9AA3B5" text-anchor="middle" letter-spacing="2">END</text>
<text x="1020" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" fill="#9AA3B5" text-anchor="middle">skipped</text>
<text x="650" y="360" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#E6EAF2" text-anchor="start">Thrust and drain halve, so the server config</text>
<text x="650" y="386" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#E6EAF2" text-anchor="start">re-tunes the jetpack and jet boots (table below).</text>
<text x="650" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#9AA3B5" text-anchor="start">The update handler runs on the living tick only,</text>
<text x="650" y="454" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#9AA3B5" text-anchor="start">never on another creature's events (F-4).</text>
